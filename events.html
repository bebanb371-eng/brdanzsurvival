<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | BRDANZ</title><link rel="stylesheet" href="/css/game.css"></head><body data-page="events"><main class="shell"><canvas id="world" class="scene-bg"></canvas><div class="scene-tint"></div><section class="content"><header class="topbar"><a class="btn secondary" href="lobby.html">← Kembali</a></header><h1>Event Island</h1><article class="panel" style="max-width:600px"><div class="item-icon"><svg class="icon icon-gift" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#gift"></use></svg></div><h2>Daily Supply Drop</h2><p>Masuk ke Island dan kumpulkan bonus harian untuk persiapan survival.</p><div class="row"><span><svg class="icon icon-coin" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#coin"></use></svg> 250 koin</span><span><svg class="icon icon-medkit" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#medkit"></use></svg> 1 Medkit</span></div><p><button id="claim">Klaim Reward</button> <span id="reward-status" class="muted"></span></p></article></section></main><script type="module" src="/js/app.js"></script><script type="module">import{updateGame}from'/src/store.js';document.querySelector('#claim').onclick=e=>{const s=updateGame(x=>{x.player.coins+=250;x.inventory.medkit++});e.currentTarget.disabled=true;document.querySelector('#reward-status').textContent='Reward tersimpan · +250 koin, +1 medkit'};</script></body></html>
