<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Karakter | BRDANZ Survival</title>
  <link rel="stylesheet" href="/css/game.css">
</head>
<body data-page="character">
  <main class="shell character-shell">
    <canvas id="world" class="scene-bg" aria-label="Model survivor 3D"></canvas>
    <div class="scene-tint"></div>
    <section class="content">
      <header class="topbar"><a class="btn secondary" href="lobby.html"><svg class="icon"><use href="/assets/icons.svg#back"></use></svg> Kembali</a><div class="playerbar"><svg class="icon"><use href="/assets/icons.svg#person"></use></svg> <b data-player="name">BRDANZ</b> · LV <span data-player="level">1</span></div></header>
      <div class="character-panel panel">
        <small>IDENTITAS SURVIVOR</small>
        <h1 data-player="name">BRDANZ</h1>
        <p class="muted">Seret area kosong untuk memutar model 3D.</p>
        <div class="stat"><span>Skin aktif</span><b id="selected-skin">Rookie</b></div>
        <a class="btn" href="skins.html"><svg class="icon"><use href="/assets/icons.svg#helmet"></use></svg> Ganti skin</a>
        <div class="character-stats">
          <div class="stat"><span>Level</span><b data-player="level">1</b></div>
          <div class="stat"><span>Pengalaman</span><b data-player="xp">0</b> XP</div>
          <div class="stat"><span>Eliminasi</span><b data-player="kills">0</b></div>
          <div class="stat"><span>Koin</span><b data-coins>1000</b></div>
        </div>
      </div>
      <p class="character-hint"><svg class="icon"><use href="/assets/icons.svg#compass"></use></svg> PREVIEW 3D · MODEL KARAKTER DAPAT DIPUTAR</p>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
